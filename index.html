<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X O X Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background-color: #1e1e2e; 
            color: #fff; 
        }
        h1 { margin-bottom: 20px; font-size: 2.2rem; color: #f5c2e7; }
        .status { font-size: 1.3rem; margin-bottom: 25px; color: #a6adc8; font-weight: bold; }
        .board { 
            display: grid; 
            grid-template-columns: repeat(3, 90px); 
            grid-template-rows: repeat(3, 90px); 
            gap: 12px; 
        }
        .cell { 
            width: 90px; 
            height: 90px; 
            background-color: #313244; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2.8rem; 
            font-weight: bold; 
            cursor: pointer; 
            user-select: none;
            transition: background 0.2s, transform 0.1s; 
        }
        .cell:active { transform: scale(0.95); }
        .cell.x { color: #f38ba8; }
        .cell.o { color: #89b4fa; }
        .btn-reset { 
            margin-top: 30px; 
            padding: 12px 28px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            background-color: #a6e3a1; 
            color: #11111b; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
        }
        .btn-reset:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>X O X Game</h1>
    <div class="status" id="status">X ගේ වාරය</div>
    
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button class="btn-reset" onclick="resetGame()">නැවත පටන්ගන්න</button>

    <script>
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let gameActive = true;
        const statusDisplay = document.getElementById("status");

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        document.querySelectorAll(".cell").forEach(cell => {
            cell.addEventListener("click", handleCellClick);
        });

        function handleCellClick(e) {
            const clickedCell = e.target;
            const index = parseInt(clickedCell.getAttribute("data-index"));

            if (board[index] !== "" || !gameActive) return;

            board[index] = currentPlayer;
            clickedCell.innerText = currentPlayer;
            clickedCell.classList.add(currentPlayer.toLowerCase());

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `${currentPlayer} දිනුවා! 🎉`;
                gameActive = false;
                return;
            }

            if (!board.includes("")) {
                statusDisplay.innerText = "ජය පරාජයෙන් තොරයි! 🤝";
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusDisplay.innerText = `${currentPlayer} ගේ වාරය`;
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            gameActive = true;
            statusDisplay.innerText = "X ගේ වාරය";
            document.querySelectorAll(".cell").forEach(cell => {
                cell.innerText = "";
                cell.classList.remove("x", "o");
            });
        }
    </script>
</body>
</html>
